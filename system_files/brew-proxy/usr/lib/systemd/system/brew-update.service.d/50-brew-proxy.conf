[Unit]
# brew-proxy-setup replaces bin/brew with a regular file, so the base unit's
# symlink condition would silently skip this service.
ConditionPathIsSymbolicLink=
ConditionFileIsExecutable=|/home/linuxbrew/.linuxbrew/bin/brew
ConditionPathIsSymbolicLink=|/home/linuxbrew/.linuxbrew/bin/brew

[Service]
User=linuxbrew
