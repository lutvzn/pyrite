# Checks for Pyrite's additions on top of Bazzite. Bazzite's own checks live in
# 00-smoke, which this directory leaves untouched so merges don't conflict.
command:
  # Installed systems only accept updates signed with cosign.pub.
  signing_policy_trusts_pyrite_key:
    exec: |
      sh -c '
      policy=/etc/containers/policy.json
      if ! jq -e ".transports.docker[\"ghcr.io/lutvzn\"][0] | .type == \"sigstoreSigned\" and .keyPath == \"/etc/pki/containers/pyrite.pub\"" "$policy" > /dev/null; then
        echo "FAIL: $policy has no sigstoreSigned rule for ghcr.io/lutvzn using pyrite.pub"
        exit 1
      fi
      if ! jq -e ".transports.docker[\"ghcr.io/ublue-os\"]" "$policy" > /dev/null; then
        echo "FAIL: $policy lost the ghcr.io/ublue-os rule"
        exit 1
      fi
      echo "OK: $policy requires Pyrite signatures for ghcr.io/lutvzn"
      '
    exit-status: 0
    stdout:
      - "/^OK:/"

  pyrite_binaries_are_executable:
    exec: |
      sh -c '
      for bin in /usr/lib/opt/brave.com/brave-origin/brave /usr/bin/zsh /usr/bin/netbird /usr/bin/netbird-ui /usr/bin/foot /usr/bin/footclient; do
        if [ ! -x "$bin" ]; then
          echo "FAIL: $bin is missing or not executable"
          exit 1
        fi
      done
      echo "OK: Brave Origin, zsh, NetBird and Foot are installed"
      '
    exit-status: 0
    stdout:
      - "/^OK:/"

  # NetBird ships disabled; users turn it on themselves.
  netbird_is_not_enabled:
    exec: |
      sh -c '
      for dir in /etc/systemd/system /usr/lib/systemd/system; do
        if [ -e "$dir/multi-user.target.wants/netbird.service" ]; then
          echo "FAIL: netbird.service is enabled in $dir"
          exit 1
        fi
      done
      echo "OK: netbird.service is installed but not enabled"
      '
    exit-status: 0
    stdout:
      - "/^OK:/"

  # Hyprland, Noctalia, brew-proxy and the Xwayland pin are skipped on deck images.
  desktop_additions_match_image_type:
    exec: |
      sh -c '
      name=$(jq -r ".\"image-name\" // empty" /usr/share/ublue-os/image-info.json 2>/dev/null)
      if [ -z "$name" ]; then
        echo "FAIL: unable to read the image name from /usr/share/ublue-os/image-info.json"
        exit 1
      fi
      wants=/etc/systemd/system/multi-user.target.wants
      case "$name" in
        *deck*)
          for path in /usr/bin/Hyprland /usr/bin/noctalia /etc/xdg/hypr/hyprland.lua; do
            if [ -e "$path" ]; then
              echo "FAIL: $name is a deck image but has $path"
              exit 1
            fi
          done
          if rpm -q brew-proxy > /dev/null 2>&1; then
            echo "FAIL: $name is a deck image but has brew-proxy"
            exit 1
          fi
          echo "OK: $name leaves out the desktop-only additions"
          ;;
        *)
          for bin in /usr/bin/Hyprland /usr/bin/noctalia; do
            if [ ! -x "$bin" ]; then
              echo "FAIL: $bin is missing on $name"
              exit 1
            fi
          done
          if ! grep -q "^local terminal    = \"footclient\"$" /etc/xdg/hypr/hyprland.lua; then
            echo "FAIL: /etc/xdg/hypr/hyprland.lua is missing or does not use footclient"
            exit 1
          fi
          if ! rpm -q brew-proxy brew-proxy-selinux > /dev/null; then
            echo "FAIL: brew-proxy is not installed on $name"
            exit 1
          fi
          for unit in brew-proxy-setup.service brew-proxy-fix-ownership.service brew-proxy-wheel-access.service; do
            if [ ! -e "$wants/$unit" ]; then
              echo "FAIL: $unit is not enabled on $name"
              exit 1
            fi
          done
          version=$(rpm -q --qf "%{VERSION}" terra-xorg-x11-server-Xwayland 2>/dev/null)
          case "$version" in
            24.*) ;;
            *)
              echo "FAIL: Xwayland should be pinned to 24.x on $name, found ${version:-nothing}"
              exit 1
              ;;
          esac
          echo "OK: $name has Hyprland, Noctalia, brew-proxy and Xwayland $version"
          ;;
      esac
      '
    exit-status: 0
    stdout:
      - "/^OK:/"

  # Every image keeps secrets in oo7, so they survive a rebase between KDE and
  # GNOME images. See build_files/pyrite/08-configure-oo7.sh.
  oo7_is_the_secret_service:
    exec: |
      sh -c '
      base=$(jq -r ".\"base-image-name\" // empty" /usr/share/ublue-os/image-info.json 2>/dev/null)
      if ! rpm -q oo7-daemon oo7-portal pam_oo7 python3-secretstorage > /dev/null; then
        echo "FAIL: oo7 or python3-secretstorage is not installed"
        exit 1
      fi
      if rpm -q gnome-keyring > /dev/null 2>&1; then
        echo "FAIL: gnome-keyring is installed and would compete with oo7"
        exit 1
      fi
      if [ ! -e /etc/systemd/user/graphical-session-pre.target.wants/oo7-daemon.service ]; then
        echo "FAIL: oo7-daemon.service does not start with graphical sessions"
        exit 1
      fi
      if [ ! -e /etc/systemd/user/graphical-session.target.wants/pyrite-kwallet-import.service ]; then
        echo "FAIL: pyrite-kwallet-import.service is not enabled"
        exit 1
      fi
      if ! grep -Eq "^-password[[:blank:]]+optional[[:blank:]]+pam_oo7\.so use_authtok$" /etc/pam.d/passwd; then
        echo "FAIL: /etc/pam.d/passwd does not update the oo7 keyring password"
        exit 1
      fi
      if ! grep -Fq -- "--password-store=gnome-libsecret" /usr/lib/opt/brave.com/brave-origin/brave-origin; then
        echo "FAIL: Brave Origin does not use libsecret"
        exit 1
      fi
      case "$base" in
        kinoite)
          if rpm -q pam-kwallet > /dev/null 2>&1; then
            echo "FAIL: pam-kwallet is installed and would start ksecretd"
            exit 1
          fi
          if ! grep -qx "org.freedesktop.impl.portal.Secret=oo7-portal" /usr/share/xdg-desktop-portal/kde-portals.conf; then
            echo "FAIL: Plasma does not use the oo7 Secret portal"
            exit 1
          fi
          ;;
        silverblue) ;;
        *)
          echo "FAIL: unknown base image ${base:-(none)}"
          exit 1
          ;;
      esac
      echo "OK: oo7 provides the Secret Service on this $base image"
      '
    exit-status: 0
    stdout:
      - "/^OK:/"

file:
  /usr/lib/os-release:
    exists: true
    contents:
      - '/^NAME="Pyrite"$/'
      # Installer profiles and scripts match on the ID, so it stays bazzite.
      - "/^ID=bazzite$/"

  /etc/pki/containers/pyrite.pub:
    exists: true
    contents:
      - "BEGIN PUBLIC KEY"

  /etc/containers/registries.d/pyrite.yaml:
    exists: true
    contents:
      - "ghcr.io/lutvzn"

  /usr/lib/opt/brave.com/brave-origin/chrome-sandbox:
    exists: true
    mode: "4755"
    owner: root

  /usr/share/dbus-1/services/org.freedesktop.secrets.service:
    exists: true
    contents:
      - "/^SystemdService=dbus-org.freedesktop.secrets.service$/"

  /usr/libexec/pyrite-kwallet-import:
    exists: true
    mode: "0755"

  /etc/xdg-desktop-portal/hyprland-portals.conf:
    exists: true
    contents:
      - "/^org.freedesktop.impl.portal.Secret=oo7-portal$/"

  /usr/lib/tmpfiles.d/pyrite-brave.conf:
    exists: true
    contents:
      - "/usr/lib/opt/brave.com"

  /etc/sysconfig/netbird:
    exists: true
    mode: "0600"

  /usr/lib/systemd/system/netbird.service:
    exists: true

  /usr/lib/modprobe.d/pyrite-hardening.conf:
    exists: true
    contents:
      - "install sctp /bin/false"

  /usr/lib/sysctl.d/55-pyrite-hardening.conf:
    exists: true
    contents:
      - "/^kernel.kptr_restrict = 2$/"

  # Patched at build time by build_files/pyrite/07-patch-upstream-files.sh.
  /usr/bin/bazzite-rollback-helper:
    exists: true
    contents:
      - '/^  "pyrite-gnome-nvidia-open"$/'
      - '!ghcr.io/ublue-os/'
      - '!"bazzite-dx'

  /etc/profile.d/verify_motd.sh:
    exists: true
    contents:
      - 'OFFICIAL_TAG="ghcr.io/lutvzn/"'

  /usr/share/ublue-os/just/92-bazzite-verify.just:
    exists: true
    contents:
      - '"ghcr.io/lutvzn/"'
      - "!ghcr.io/ublue-os/"

  /usr/share/ublue-os/bazaar/hooks.py:
    exists: true
    contents:
      - "brew trust ublue-os/tap && brew tap ublue-os/tap && brew install --cask"
